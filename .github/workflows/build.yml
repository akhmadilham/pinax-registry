name: Build & Publish Catalog

on:
  push:
    branches: [ main ]
    paths:
      - 'data/skills/**'
      - 'data/categories.json'
      - 'data/conflicts.json'
      - 'engine/builder.py'

jobs:
  build:
    name: Compile Catalog & Checksum
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile data/catalog.json
        run: |
          python engine/builder.py .

      - name: Check for Uncommitted Changes
        run: |
          git diff --exit-code data/catalog.json || (echo "Error: data/catalog.json is out of date. Run engine/builder.py locally and commit." && exit 1)

      - name: Upload Catalog Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinax-catalog
          path: data/catalog.json

      - name: Trigger Vercel Deploy Hook (pinax-skills)
        if: success()
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Triggering Vercel deployment for pinax-skills..."
            curl -s -X POST "$VERCEL_DEPLOY_HOOK"
            echo "Deploy hook triggered successfully."
          else
            echo "VERCEL_DEPLOY_HOOK secret is not set. Skipping auto-deploy trigger."
          fi

